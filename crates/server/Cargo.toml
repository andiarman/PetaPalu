[package]
name = "petapalu-server"
version = "0.1.0"
edition = "2021"
description = "High-performance Axum/Tokio backend server for Peta Palu"
authors = ["Andi Arman <andiarman@users.noreply.github.com>"]

[dependencies]
petapalu-common = { path = "../common" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
