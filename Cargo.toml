[workspace]
members = [
    "crates/common",
    "crates/server",
    "crates/frontend",
    "src-tauri",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.petapalu-frontend]
opt-level = "z" # Optimize for size on WebAssembly
