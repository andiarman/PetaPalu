name: Build Android APK (Rust / Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build PetaPalu.apk (Rust Tauri v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android

      - name: Setup Android SDK Platform, NDK & Licenses
        run: |
          ANDROID_NDK_VERSION="26.1.10909125"
          echo "Memasang Android Platform 34, Build Tools, dan NDK..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;$ANDROID_NDK_VERSION"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          NDK_PATH="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download & Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin
          trunk --version

      - name: Build Rust WebAssembly Frontend
        run: |
          trunk build --release --public-url /

      - name: Install Tauri CLI
        run: |
          npm install -g @tauri-apps/cli

      - name: Initialize Android Target
        run: |
          tauri android init --skip-targets-install --ci
          chmod +x src-tauri/gen/android/gradlew || true

      - name: Tambahkan Android Permissions (Internet & GPS)
        run: |
          python3 -c "
          import os
          manifest = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r') as f:
                  content = f.read()
              perms = '''    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n'''
              if '<application' in content and 'ACCESS_FINE_LOCATION' not in content:
                  content = content.replace('<application', perms + '    <application', 1)
                  with open(manifest, 'w') as f:
                      f.write(content)
                  print('Berhasil menyematkan izin GPS & Internet ke AndroidManifest.xml')
          "

      - name: Build Android APK (ARM64)
        run: |
          echo "Membangun berkas APK Android via Rust Tauri..."
          if ! tauri android build --apk --target aarch64 --debug --ci > build_output.txt 2>&1; then
            echo "::error::Kompilasi Tauri Android Gagal!"
            exit 1
          fi
          
          echo "Kompilasi sukses! Mencari file APK..."
          find src-tauri/gen/android -name "*.apk"

      - name: Push Build Log ke Branch android-build-log jika Gagal
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B android-build-log
          git add -f build_output.txt
          git commit -m "chore(debug): tauri android build output log [skip ci]" || true
          git push -f origin android-build-log || true

      - name: Siapkan Artefak APK Siap Unduh
        run: |
          mkdir -p output-apk
          APK_FILE=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output-apk/PetaPalu.apk
            echo "File APK berhasil disiapkan:"
            ls -lh output-apk/PetaPalu.apk
          else
            echo "Peringatan: Berkas .apk tidak ditemukan"
            exit 1
          fi

      - name: Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PetaPalu-Android-APK
          path: output-apk/PetaPalu.apk
          if-no-files-found: error
