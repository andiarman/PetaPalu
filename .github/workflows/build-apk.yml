name: Build Android APK (Rust / Tauri)

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build PetaPalu.apk (Rust Tauri v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Android NDK
        run: |
          ANDROID_NDK_VERSION="26.1.10909125"
          echo "Installing Android NDK $ANDROID_NDK_VERSION..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Download & Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin
          trunk --version

      - name: Build Rust WebAssembly Frontend
        run: |
          trunk build --release --public-url /

      - name: Install Tauri CLI
        run: |
          npm install -g @tauri-apps/cli

      - name: Initialize Android Target
        run: |
          tauri android init --skip-targets-install --ci

      - name: Tambahkan Android Permissions (Internet & GPS)
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            echo "AndroidManifest.xml updated with permissions:"
            head -n 25 "$MANIFEST"
          fi

      - name: Build Android APK (ARM64 & ARMv7)
        run: |
          echo "Building Android APK via Rust / Tauri..."
          tauri android build --apk --target aarch64 --debug
          
          echo "Daftar berkas APK yang dihasilkan:"
          find src-tauri/gen/android -name "*.apk"

      - name: Siapkan Artefak APK Siap Unduh
        run: |
          mkdir -p output-apk
          # Salin file APK debug yang siap install di seluruh HP Android
          find src-tauri/gen/android -name "*.apk" -exec cp {} output-apk/PetaPalu.apk \;
          echo "Ukuran file APK:"
          ls -lh output-apk/PetaPalu.apk

      - name: Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PetaPalu-Android-APK
          path: output-apk/PetaPalu.apk
          if-no-files-found: error
