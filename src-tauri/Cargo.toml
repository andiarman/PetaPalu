[package]
name = "petapalu-app"
version = "0.1.0"
description = "Peta Palu Android & Desktop App"
authors = ["Andi Arman <andiarman@duck.com>"]
edition = "2021"

[workspace]

[lib]
name = "petapalu_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2" }
tauri-plugin-log = "2"
